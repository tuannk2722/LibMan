name: Validate PlantUML Diagrams

on:
  push:
    paths:
      - 'spec/diagrams/src/**'
      - '.github/workflows/render-diagrams.yml'
  pull_request:
    paths:
      - 'spec/diagrams/src/**'
      - '.github/workflows/render-diagrams.yml'
  workflow_dispatch:

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    env:
      PLANTUML_VERSION: '1.2026.10'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache PlantUML jar
        id: cache-plantuml
        uses: actions/cache@v4
        with:
          path: /tmp/plantuml-${{ env.PLANTUML_VERSION }}.jar
          key: plantuml-${{ env.PLANTUML_VERSION }}

      - name: Download PlantUML jar
        if: steps.cache-plantuml.outputs.cache-hit != 'true'
        run: |
          curl -fsSL \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar" \
            -o "/tmp/plantuml-${PLANTUML_VERSION}.jar"

      - name: Render all PlantUML sources to SVG
        run: |
          mkdir -p /tmp/rendered-svg
          java -jar "/tmp/plantuml-${PLANTUML_VERSION}.jar" \
            -charset UTF-8 -tsvg -o /tmp/rendered-svg spec/diagrams/src/H*.puml

      - name: Verify generated SVGs
        run: |
          count=$(ls -1 /tmp/rendered-svg/H*.svg | wc -l)
          echo "Rendered $count SVG files"
          if [ "$count" -ne 12 ]; then
            echo "Expected 12 rendered SVGs, got $count"
            exit 1
          fi
          if grep -E -i "Syntax Error|cannot be found|Cannot include" /tmp/rendered-svg/H*.svg; then
            echo "Found PlantUML error marker in generated SVG"
            exit 1
          fi
